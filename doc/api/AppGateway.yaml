        description: 进程提供auxproxy访问的接口（需要符合端口要求：1~65535）
        minimum: 0
        maximum: 65535
        example: '8081'
      aux_proxy_port:
        type: integer
        description: AuxProxy对外暴露服务的端口（需要符合端口要求：1~65535）
        minimum: 0
        maximum: 65535
