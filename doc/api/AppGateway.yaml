definitions:
  RegisterAppProcessRequestBody:
    description: 创建app process请求的body体
    properties:
      pid:
        type: integer
        description: 进程ID，通常pid的最大值可以通过/proc/sys/kernel/pid_max文件查看，为32768
        minimum: 1
        maximum: 32768
        example: 3664
      instance_id:
        type: string
        description: 进程所属的server的ID
        minLength: 1
        maxLength: 128
        example: 43b75508-5c7f-49e0-9982-fe3cf73bdb3a
      scaling_group_id:
        type: string
        description: 进程所属的fleet的ID
        minLength: 1
        maxLength: 128
        example: 43b75508-5c7f-49e0-9982-fe3cf73bdb3a
      fleet_id:
        type: string
        description: 进程所属的fleet的ID
        minLength: 1
        maxLength: 128
        example: 43b75508-5c7f-49e0-9982-fe3cf73bdb3a
      ip_address:
        type: string
        description: AuxProxy所在虚拟机的公网IP，需符合IP地址的规范
        example: 100.10.10.90
        pattern: '(\.((2(5[0-5]|[0-4]\d))|[0-1]?\d{1,2})){3}'
      private_ip:
        type: string
        description: AuxProxy所在虚拟机的私网IP，需符合IP地址的规范
        example: 192.168.0.90
        pattern: '(\.((2(5[0-5]|[0-4]\d))|[0-1]?\d{1,2})){3}'
      aux_proxy_port:
        type: integer
        description: AuxProxy对外暴露服务的端口（需要符合端口要求：1~65535）
        minimum: 0
        maximum: 65535
        example: 10001
      max_server_session_num:
        type: integer
        description: >-
          进程支持创建的最大server session数，游戏场景1个，搜索场景假设一个节点一个进程，那么一个进程最多1000个server
          session（因为一个节点默认1000个shard），暂时先设为50个
        minimum: 1
        maximum: 50
        example: 50
      new_server_session_protection_policy:
        type: string
        description: >-
          server
          session的保护策略，NO_PROTECTION表示缩容时可以直接干掉ServerSession，TIME_LIMIT_PROTECTION表示给进程一段时间自己退出，超时后直接干掉，FULL_PROTECTION表示ACTIVE状态的server
          session不能被直接干掉
        enum:
          - NO_PROTECTION
          - TIME_LIMIT_PROTECTION
          - FULL_PROTECTION
        example: NO_PROTECTION
      server_session_protection_time_limit_minutes:
        type: integer
        description: server session删除时，等待其返回结果的时长
        minimum: 5
        maximum: 1440
        example: 5
      server_session_activation_timeout_seconds:
        type: integer
        description: server session激活时长
        minimum: 1
        maximum: 600
        example: 1
      biz_pid:
        type: integer
        format: int32
        minimum: 1
        maximum: 32768
        description: 业务进程ID
        example: 1012
      launch_path:
        type: string
        minLength: 1
        maxLength: 262144
        description: 启动路径
        example: /local/app/lucene.sh
      parameters:
        type: string
        description: 启动参数
        minLength: 1
        maxLength: 262144
        example: ''
    required:
      - pid
      - instance_id
      - scaling_group_id
      - fleet_id
      - ip_address
      - private_ip
      - aux_proxy_port
      - max_server_session_num
      - new_server_session_protection_policy
      - server_session_protection_time_limit_minutes
      - server_session_activation_timeout_seconds
      - biz_pid
      - launch_path
  RegisterAppProcessResponseBody:
    description: 创建app process返回的body体
    type: object
    properties:
      app_process:
        $ref: '#/definitions/AppProcess'
  ListAppProcessResponseBody:
    type: object
    properties:
      count:
        type: integer
        description: 最大值为int32的最大值
        minimum: 0
        maximum: 2147483647
        example: 1
      app_process:
        $ref: '#/definitions/AppProcessList'
  ShowAppProcessResponseBody:
    type: object
    properties:
      app_process:
        $ref: '#/definitions/AppProcess'
  ShowAppProcessCountResponseBody:
    type: object
    properties:
      app_process_states:
        $ref: '#/definitions/AppProcessCounts'
  UpdateAppProcessRequestBody:
    description: 创建app process请求的body体
    properties:
      state:
        type: string
        description: 进程所处的状态（AVTIVATING、ACTIVE、TERMINATING、TERMINATED、ERROR）
        enum:
          - AVTIVATING
          - ACTIVE
          - TERMINATING
          - TERMINATED
          - ERROR
        example: AVTIVATING
      port:
        type: integer
        description: 进程提供服务的接口（需要符合端口要求：0~65535）
        minimum: 1
        maximum: 65535
        example: 8080
      grpc_port:
        type: integer
        description: 进程提供auxproxy访问的接口（需要符合端口要求：0~65535）
        minimum: 1
        maximum: 65535
        example: 8081
      log_path:
        type: array
        description: 存放进程日志的路径
        items:
          type: string
          example: /tmp/log/logfile
          pattern: ^\/(\w+\/?)+$
          minLength: 0
          maxLength: 1000
        minItems: 0
        maxItems: 100
    required:
      - state
      - port
      - grpc_port
  UpdateAppProcessResponseBody:
    type: object
    properties:
      app_process:
        $ref: '#/definitions/AppProcess'
  UpdateAppProcessStateRequestBody:
    description: 创建app process state请求的body体
    type: object
    required:
      - state
    properties:
      state:
        type: string
        description: 进程所处的状态（ACTIVE、TERMINATING、TERMINATED、ERROR）
        enum:
          - ACTIVE
          - TERMINATING
          - TERMINATED
          - ERROR
        example: ACTIVE
  UpdateAppProcessStateResponseBody:
    type: object
    properties:
      server_session:
        $ref: '#/definitions/AppProcess'
  AppProcessList:
    type: array
    items:
      $ref: '#/definitions/AppProcess'
    minItems: 0
    maxItems: 100
  AppProcessCounts:
    type: object
    properties:
      total_count:
        type: integer
        description: 所有的进程数
        example: 10
        minimum: 0
        maximum: 2147483647
      process_counts:
        type: array
        description: 进程按照状态分类，每种状态的进程数量
        items:
          $ref: '#/definitions/ProcessCount'
        minItems: 0
        maxItems: 5
  ProcessCount:
    type: object
