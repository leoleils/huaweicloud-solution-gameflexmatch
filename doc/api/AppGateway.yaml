swagger: '2.0'
info:
  version: v1
  title: Application Gateway
  description: |
    app gateway服务，提供应用进程、server session、client session的增删改查接口
schemes:
  - https
host: scase.myhuaweicloud.com
basePath: /v1
tags:
  - name: AppProcess管理接口
  - name: ServerSession管理接口
  - name: ClientSession管理接口
  - name: InstanceConfiguration管理接口
paths:
  '/app-processes':
    post:
      tags:
        - AppProcess管理接口
      operationId: RegisterAppProcess
      summary: 注册App Process
      description: Register app process
      x-is-registered: 'N'
      x-support-sdk: 'N'
      produces:
        - application/json
      parameters:
        - in: body
          name: RegisterAppProcessRequestBody
          description: App Process object that needs to be created
          required: true
          schema:
            $ref: '#/definitions/RegisterAppProcessRequestBody'
      responses:
        '200':
          description: App Process Info
          schema:
            $ref: '#/definitions/RegisterAppProcessResponseBody'
          headers:
            X-request-id:
              type: string
              description: >-
                This field is the request ID number for task tracking. Format is
                request_uuid-timestamp-hostname.
        '400':
          description: Error response
          schema:
            $ref: '#/definitions/ErrorRsp'
          headers:
            X-request-id:
              type: string
              description: >-
                This field is the request ID number for task tracking. Format is
                request_uuid-timestamp-hostname.
        '500':
          description: Error response
          schema:
            $ref: '#/definitions/ErrorRsp'
          headers:
            X-request-id:
              type: string
              description: >-
                This field is the request ID number for task tracking. Format is
                request_uuid-timestamp-hostname.
    get:
      tags:
        - AppProcess管理接口
      operationId: ListAppProcesses
      summary: 查询AppProcess列表
      description: Get App Process list
      x-is-registered: 'N'
      x-support-sdk: 'N'
      produces:
        - application/json
      parameters:
        - in: query
          name: offset
          type: integer
          description: 分页偏移量，为0表示第一页，为1表示从第二页开始显示
          required: false
          minimum: 0
          maximum: 2147483647
        - in: query
          name: limit
          type: integer
          description: The numbers of items to return
          required: false
          minimum: 1
          maximum: 100
        - in: query
          name: sort
          type: string
          description: 'The sort type, created_at%3Adesc表示列表以创建时间降序排列'
          enum:
            - created_at%3Adesc
          required: false
        - in: query
          name: fleet_id
          type: string
          description: The fleet id
          minLength: 1
          maxLength: 128
          required: false
        - in: query
          name: instance_id
          type: string
          description: The instance id
          minLength: 36
          maxLength: 36
          required: false
      responses:
        '200':
          description: Process List Information
          schema:
            $ref: '#/definitions/ListAppProcessResponseBody'
          headers:
            X-request-id:
              type: string
              description: >-
                This field is the request ID number for task tracking. Format is
                request_uuid-timestamp-hostname.
        '400':
          description: Error response
          schema:
            $ref: '#/definitions/ErrorRsp'
          headers:
            X-request-id:
              type: string
              description: >-
                This field is the request ID number for task tracking. Format is
                request_uuid-timestamp-hostname.
        '500':
