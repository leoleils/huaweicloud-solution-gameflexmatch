        {
          "instance_scaling_group_name": "my-group",
          "min_instance_number": 0,
          "max_instance_number": 0,
          "desire_instance_number": 0,
          "cool_down_time": 0,
          "subnet_id": "1d07cdc9-d9ce-d30a-e74c-d4ff97edd590",
          "vpc_id": "9f33ada0-532c-a198-4a53-e6f2c9705f42",
          "instance_type": "VM",
          "vm_template": {
              "available_flavor_ids": [
                  "c3.large.2",
                  "c6.large.2"
              ],
              "image_id": "673f0a4d-4df3-d5b2-a6b2-f7692ea25ab1",
              "disks": [
                  {
                      "size": 32768,
                      "volume_type": "SATA",
                      "disk_type": "SYS"
                  }
              ],
              "security_groups": [
                  {
                      "id": "ed357e1a-6703-8c34-6e34-15ebb4031d82"
                  }
              ],
              "eip": {
                  "ip_type": "5_bgp",
                  "bandwidth": {
                      "size": 10,
                      "share_type": "WHOLE"
                  }
              },
              "key_name": "string"
          },
          "instance_configuration": {
              "runtime_configuration": {
                  "process_configurations": [
                      {
                          "launch_path": "C://Game/startup.exe",
                          "parameters": "--port=1234",
                          "concurrent_executions": 50
                      }
                  ],
                  "server_session_activation_timeout_seconds": 600,
                  "max_concurrent_server_sessions_per_process": 50
              },
              "server_session_protection_policy": "NO_PROTECTION",
              "server_session_protection_time_limit_minutes": 5
          },
          "fleet_id": "b21e52e9-b333-b68b-5edd-9453dfdd326f",
          "enable_auto_scaling": false,
          "agency": {
              "name": "IAMAgency",
              "domain_id": "a8327883-6b07-4497-9c61-68d03ee193a1"
          }
        }
      responses:
        "201":
          description: ""
          schema:
            $ref: "#/definitions/CreateInstanceScalingGroupRespBody"
          headers:
            X-Request-Id:
              type: string
              description: >-
                This field is the request ID number for task tracking. Format is
                request_uuid-timestamp-hostname.
        "400":
          description: Error response
          schema:
            $ref: "#/definitions/ErrorRsp"
          headers:
            X-Request-Id:
              type: string
              description: >-
