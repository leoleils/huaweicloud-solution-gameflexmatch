swagger: "2.0"
info:
  version: v1
  title: AASS
  description: |-
    负责Region内的实例伸缩组及其伸缩策略的管理，其中伸缩策略为实例伸缩组的属性。
    负责基于伸缩策略对实例进行弹性伸缩活动。
    Region级的内部服务，仅面向FleetManager与APPGateway，不面向外部用户。
basePath: /v1
tags:
  - name: InstanceScalingGroup
  - name: ScalingPolicy
schemes:
  - https
x-service-scope: region
paths:
  "/{project_id}/instance-scaling-groups":
