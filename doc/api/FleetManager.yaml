definitions:
  CreateFleetRequestBody:
    description: 创建应用进程队列请求体
    properties:
      name:
        type: string
        description: 应用进程队列的名称. 可以不唯一.
        minLength: 1
        maxLength: 1024
        example: MyDemo
      description:
        type: string
        description: 应用进程队列描述
        minLength: 1
        maxLength: 1024
        example: this is a demo
      build_id:
        type: string
        description: 应用包id，创建后不支持修改
        example: build-52d872a5-acd3-11ec-a7e0-6805cab276a1
        minLength: 1
        maxLength: 64
      region:
        type: string
        default: cn-north-4
        example: cn-north-4
        description: |-
          应用进程队列所在的region，只支持北京四region
          * cn-north-4: 北京四
        enum:
          - cn-north-4
      bandwidth:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 1
        example: 100
        description: 应用队列单实例公网出带宽最大值，默认1，单位Mbps，范围1-200，可提单提高配额
      instance_specification:
        type: string
        description: |-
          实例规格，当前只支持2种标准型 
          * scase.standard.4u8g
          * scase.standard.8u16g
        default: scase.standard.4u8g
        example: scase.standard.4u8g
        enum:
          - scase.standard.4u8g
          - scase.standard.8u16g
      enterprise_project_id:
        type: string
        description: fleet所在的企业项目，默认为服务部署时所指定的企业项目，若服务部署时没有指定，则为默认企业项目
        default: 0
        example: 238012fd-0649-4fc8-bb89-bf6fc8b38d72
      vpc_name:
        type: string
        description: |-
          * 指定资源租户上的VPC创建fleet，若指定的VPC不存在则新建fleet失败
          * 在指定VPC创建Fleet时，会在指定的VPC上创建子网，并且会检查子网是否与已有子网冲突，若冲突则会再次随机子网，最多重复10次
          * 需要保证指定的VPC网段包含部署时配置的VPC网段，否则可能导致创建fleet失败
        default: ''
        example: vpc-metaspace
      server_session_protection_policy:
        type: string
        description: >-
          服务服务器会话保护策略

          * NO_PROTECTION:         不保护，缩容时如果有会话在实例上运行，直接缩容    

          * FULL_PROTECTION:       完全保护，缩容时如果有会话在实例上运行，等待会话结束再缩容

          * TIME_LIMIT_PROTECTION:
          限时保护，缩容时如果有会话在实例上运行，等待一定时间后缩容，等待时间由server_session_protection_time_limit_minutes指定
        example: NO_PROTECTION
        enum:
          - NO_PROTECTION
          - FULL_PROTECTION
          - TIME_LIMIT_PROTECTION
      server_session_protection_time_limit_minutes:
        type: integer
        format: int32
        description: >-
          server_session_protection_policy字段为TimeLimitProtection时有效，单位分钟，最大值不超过一天
        minimum: 5
        maximum: 1440
        default: 5
        example: 5
      resource_creation_limit_policy:
        $ref: '#/definitions/ResourceCreationLimitPolicy'
        description: 对客户端在指定时间内可以创建的服务器会话数量进行限制的策略。通过这个策略，你可以控制客户端消耗可用资源的能力。
      runtime_configuration:
        $ref: '#/definitions/RuntimeConfiguration'
        description: 应用进程队列的运行时配置信息
      inbound_permissions:
        type: array
        minItems: 1
        maxItems: 50
        description: 访问配置，即允许外部访问应用进程的IP地址和端口描述
        items:
          $ref: '#/definitions/IpPermission'
      instance_tags:
        type: array
        description: 实例标签数组
        minItems: 0
        maxItems: 10
        items:
          $ref: '#/definitions/InstanceTag'
    required:
      - name
      - build_id
      - runtime_configuration
      - inbound_permissions
  CreateFleetResponseBody:
    required:
      - fleet
    properties:
      fleet:
        $ref: '#/definitions/Fleet'
  ShowFleetResponseBody:
    required:
      - fleet
    properties:
      fleet:
        $ref: '#/definitions/Fleet'
  ProcessConfiguration:
    description: 应用进程描述
    properties:
      launch_path:
        type: string
        description: 应用进程启动程序路径，linux风格文件路径
        example: /home/scase/start_up.sh
        minLength: 0
        maxLength: 1024
      parameters:
        type: string
        description: 应用进程启动入参
        example: '--port=1234'
        minLength: 0
        maxLength: 1024
      concurrent_executions:
        type: integer
        description: 并发应用进程数
        example: 1
        minimum: 1
        maximum: 50
    required:
      - launch_path
      - parameters
      - concurrent_executions
  Fleet:
    description: 应用进程队列
    properties:
      fleet_id:
        type: string
        description: 应用进程队列的id
        minLength: 1
        maxLength: 64
        example: fleet-77317ac6-acd8-11ec-a7e0-6805cab276a1
      name:
        type: string
        description: 应用进程队列的名称. 可以不唯一.
        minLength: 1
        maxLength: 1024
        example: MyDemo
      description:
        type: string
        description: 应用队列描述
        minLength: 1
        maxLength: 1024
        example: this is a demo
      region:
        type: string
        default: cn-north-4
        description: 应用进程队列所在的region，只支持北京四region - cn-north-4 北京四
        enum:
          - cn-north-4
        example: cn-north-4
      state:
        type: string
        description: |-
          队列状态 
          * CREATING:     创建中 
          * ACTIVE:       活跃 
          * ERROR:        错误
          * DELETING:     删除中 
          * TERMINATED:   已终止
        enum:
          - CREATING
          - ACTIVE
          - ERROR
          - DELETING
          - TERMINATED
        example: CREATING
      build_id:
        type: string
        description: 应用包id，创建后不支持修改，用户创建应用包后返回的id
        example: build-52d872a5-acd3-11ec-a7e0-6805cab276a1
        minLength: 1
        maxLength: 64
      bandwidth_size:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 1
        example: 1
        description: 应用队列单实例公网出带宽最大值，默认1Mbps，范围1-200Mbps，可提单提高配额
      instance_specification:
        type: string
        description: |-
          实例规格，当前只支持2种标准型 
          * scase.standard.4u8g 
          * scase.standard.8u16g
        default: scase.standard.4u8g
        example: scase.standard.4u8g
        enum:
          - scase.standard.4u8g
          - scase.standard.8u16g
      operating_system:
        type: string
        description: 操作系统类型
        minLength: 1
        maxLength: 128
        example: linux
      server_session_protection_policy:
        type: string
        description: >-
          服务服务器会话保护策略

          * NO_PROTECTION:         不保护，缩容时如果有会话在实例上运行，直接缩容    

          * FULL_PROTECTION:       完全保护，缩容时如果有会话在实例上运行，等待会话结束再缩容

          * TIME_LIMIT_PROTECTION:
          限时保护，缩容时如果有会话在实例上运行，等待一定时间后缩容，等待时间由server_session_protection_time_limit_minutes指定
        example: NO_PROTECTION
        enum:
          - NO_PROTECTION
          - FULL_PROTECTION
          - TIME_LIMIT_PROTECTION
      server_session_protection_time_limit_minutes:
        type: integer
        format: int32
        description: >-
          server_session_protection_policy字段为TimeLimitProtection时有效，单位分钟，最大值不超过一天
        minimum: 5
        maximum: 1440
        default: 5
        example: 5
      enable_auto_scaling:
        type: boolean
        description: 是否使能自动弹性伸缩，默认值为true，为false时策略仍旧存在，但是不会触发弹性伸缩动作
        default: 'true'
        example: 'true'
      resource_creation_limit_policy:
        $ref: '#/definitions/ResourceCreationLimitPolicy'
      creation_time:
        type: string
        description: 应用进程队列创建时间，结束时间，UTC时间，遵循RFC3339规范，例如2019-12-09T06:10:29Z
        minLength: 1
        maxLength: 32
        example: '2020-06-28T00:00:00Z'
      instance_tags:
        type: array
        description: 实例标签数组
        minItems: 0
        maxItems: 10
        items:
          $ref: '#/definitions/InstanceTag'
      enterprise_project_id:
        type: string
        description: 应用进程队列所在的企业项目
        minLength: 1
        maxLength: 1024
  InstanceTag:
    properties:
      key:
        type: string
        description: 标签的键
        example: key
        minLength: 1
        maxLength: 36
      value:
        type: string
        description: 标签的值
        example: value
        minLength: 0
        maxLength: 36
    required:
      - key
  IpPermission:
    properties:
      protocol:
        description: |
          传输层协议 
          * TCP: TCP协议
          * UDP: UDP协议
        type: string
        example: TCP
        enum:
          - TCP
          - UDP
      ip_range:
        type: string
        description: IP 段范围，合法的 CIDR 地址类型，只支持IPv4，如所有IPv4来源：0.0.0.0/0
        example: 0.0.0.0/0
        minLength: 9
        maxLength: 18
      from_port:
        type: integer
        minimum: 1025
        maximum: 60000
        description: 起始端口号
        example: 1025
      to_port:
        type: integer
        minimum: 1025
        maximum: 60000
        example: 1025
        description: 结束端口号
    required:
      - protocol
      - ip_range
      - from_port
      - to_port
  ErrorRsp:
    description: 失败时返回的错误对象
    properties:
      error_code:
        description: 错误码
        type: string
        minLength: 8
        maxLength: 36
      error_msg:
        description: 错误描述
        type: string
        minLength: 2
        maxLength: 512
    required:
      - error_code
      - error_msg
  ListMonitorInstancesResponceBody:
    properties:
      total_count:
        type: integer
        format: int32
        description: 实例总数量
        minimum: 0
        maximum: 2147483647
        example: 1
      count:
        type: integer
        format: int32
        description: 筛选出的实例数量
        minimum: 0
        maximum: 100
        example: 1
      instances:
        type: array
        description: 实例数组
        minItems: 0
        maxItems: 100
        items:
          $ref: '#/definitions/MonitorInstance'
  ListMonitorAppProcessResponceBody:
    properties:
      total_count:
        type: integer
        format: int32
        description: 进程总数量
        minimum: 0
        maximum: 2147483647
        example: 1
      count:
        type: integer
        format: int32
        description: 筛选出的进程数量
        minimum: 0
        maximum: 100
        example: 1
      app_processes:
        type: array
        description: 进程数组
        minItems: 0
        maxItems: 100
        items:
          $ref: '#/definitions/MonitorAppProcess'
  MonitorAppProcess:
    allOf:
      - $ref: '#/definitions/Process'
    properties:
      instance_id:
        type: string
        description: 实例的id
        minLength: 1
        maxLength: 64
        example: 6066645a-b078-4a00-90d1-7f10aaf87a5b
  MonitorInstance:
    properties:
      instance_id:
        type: string
        description: 实例的id
        minLength: 1
        maxLength: 64
        example: 6066645a-b078-4a00-90d1-7f10aaf87a5b
      instance_name:
        type: string
        description: 实例名
        minLength: 1
        maxLength: 64
        example: Fleet_25b24e04-8d6d-11ed-93a1-fa163ecd2586_aass_config-9SK1IKR8
      life_cycle_state:
        type: string
        minLength: 1
        maxLength: 64
        description: >-
          实例所处的生命周期
          * INSERVICE：已启用
          * PENDING：正在加入伸缩组
          * PENDING_WAIT：等待（正在加入伸缩组）
          * REMOVING：正在移出伸缩组
          * REMOVING_WAIT：等待（正在移出伸缩组）
          * STANDBY：已备用
          * ENTERING_STANDBY：进入备用状态
        enum:
          - INSERVICE
          - PENDING
          - PENDING_WAIT
          - REMOVING
          - REMOVING_WAIT
          - STANDBY
          - ENTERING_STANDBY
        example: INSERVICE
      health_status:
        type: string
        minLength: 1
        maxLength: 64
        description: >-
          实例的健康状态
          * ERROR：异常状态
          * NORMAL: 正常状态
          * INITAILIZING：初始化
        enum:
          - ERROR
          - NORMAL
          - INITAILIZING
        example: NORMAL
      created_at:
        type: string
        minLength: 1
        maxLength: 64
        description: 实例的创建时间
        example: '2023-01-06T10:52:54Z'
      process_count:
        type: integer
        format: int32
        description: 实例上进程的数量
        minimum: 0
        maximum: 50
        example: 1
      ip_address:
        type: string
        minLength: 1
        maxLength: 64
        description: 实例的公网IP地址
        example: 100.93.15.206
      server_session_count:
        type: integer
        format: int32
        description: 实例上会话的数量
        minimum: 0
        maximum: 2500
        example: 1
  ListMonitorServerSessionResponceBody:
    properties:
      total_count:
        type: integer
        format: int32
        description: 会话总数量
        minimum: 0
        maximum: 2147483647
        example: 1
      count:
        type: integer
        format: int32
        description: 筛选出的会话数量
        minimum: 0
        maximum: 100
        example: 1
      server_sessions:
        type: array
        description: 会话数组
        minItems: 0
        maxItems: 100
        items:
          $ref: '#/definitions/MonitorServerSession'
  MonitorServerSession:
    allOf:
      - $ref: '#/definitions/ServerSession'
    properties:
      instance_id:
        type: string
        description: 会话所在实例的id
        minLength: 1
        maxLength: 64
        example: 77317ac6-acd8-11ec-a7e0-6805cab276a1
      process_id:
        type: string
        description: 会话所在进程的id
        minLength: 1
        maxLength: 64
        example: 77317ac6-acd8-11ec-a7e0-6805cab276a1
  ListFleetsResponseBody:
    properties:
      count:
        type: integer
        format: int32
        description: 应用队列总数
        minimum: 0
        maximum: 2147483647
        example: 1
      fleets:
        description: 应用进程队列数组
        minItems: 0
        maxItems: 100
        items:
          $ref: '#/definitions/Fleet'
        type: array
    description: 1、把基本信息返回回来
    required:
      - count
      - fleets
  RuntimeConfiguration:
    properties:
      server_session_activation_timeout_seconds:
        type: integer
        format: int32
        description: 下发创建server session请求到server session的状态变为可用状态的超时时间，默认600秒
        minimum: 1
        maximum: 600
        default: 600
        example: 600
      max_concurrent_server_sessions_per_process:
        type: integer
        format: int32
        description: 单进程最大并发server session数量
        default: 1
        minimum: 1
        maximum: 50
        example: 1
      process_configurations:
        description: 进程配置信息
        minItems: 1
        maxItems: 50
        items:
          $ref: '#/definitions/ProcessConfiguration'
        type: array
  ResourceCreationLimitPolicy:
    properties:
      policy_period_in_minutes:
        type: integer
        format: int32
        minimum: 1
        maximum: 60
        default: 1
        example: 1
        description: >-
          同一个creator_id在policy_period_in_minutes指定的时间段内最多只能创建new_sessions_per_creator个服务器会话
      new_sessions_per_creator:
        type: integer
        format: int32
        description: 同一个creator_id能在policy_period_in_minutes字段指定的时间段内能创建的最大服务器会话数
        minimum: 1
        maximum: 60
        default: 1
        example: 1
  UpdateFleetAttributesReuqestBody:
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 1024
