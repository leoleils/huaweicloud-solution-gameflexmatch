definitions:
  CreateFleetRequestBody:
    description: 创建应用进程队列请求体
    properties:
      name:
        type: string
        description: 应用进程队列的名称. 可以不唯一.
        minLength: 1
        maxLength: 1024
        example: MyDemo
      description:
        type: string
        description: 应用进程队列描述
        minLength: 1
        maxLength: 1024
        example: this is a demo
      build_id:
        type: string
        description: 应用包id，创建后不支持修改
        example: build-52d872a5-acd3-11ec-a7e0-6805cab276a1
        minLength: 1
        maxLength: 64
      region:
        type: string
        default: cn-north-4
        example: cn-north-4
        description: |-
          应用进程队列所在的region，只支持北京四region
          * cn-north-4: 北京四
        enum:
          - cn-north-4
      bandwidth:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 1
        example: 100
        description: 应用队列单实例公网出带宽最大值，默认1，单位Mbps，范围1-200，可提单提高配额
      instance_specification:
        type: string
        description: |-
          实例规格，当前只支持2种标准型 
          * scase.standard.4u8g
          * scase.standard.8u16g
        default: scase.standard.4u8g
        example: scase.standard.4u8g
        enum:
          - scase.standard.4u8g
          - scase.standard.8u16g
      server_session_protection_policy:
        type: string
