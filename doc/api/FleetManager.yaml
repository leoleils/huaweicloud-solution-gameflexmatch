swagger: '2.0'
info:
  version: v1
  title: Fleet Manager
  description: 应用进程队列管理
host: scase.myhuaweicloud.com
schemes:
  - https
basePath: /v1
produces:
  - application/json
consumes:
  - application/json; charset=UTF-8
tags:
  - name: 应用进程队列管理
  - name: 伸缩策略管理
  - name: 服务器会话管理
  - name: 客户端会话管理
  - name: 应用进程管理
  - name: 应用包管理
parameters:
  xAuthToken:
    name: X-Auth-Token
    in: header
    type: string
    description: |
      用户Token。

      通过调用IAM服务获取用户Token接口获取（响应消息头中X-Subject-Token的值）。
      [IAM token获取](https://support.huaweicloud.com/api-iam/iam_30_0001.html)
    required: true
    minLength: 1
    maxLength: 16384
  contentType:
    name: Content-Type
    in: header
    required: true
    type: string
    minLength: 1
    maxLength: 64
    description: |
      MIME类型；带请求体的请求该字段需为 application/json;charset=utf-8
  projectId:
    name: project_id
    in: path
    type: string
    description: |
      项目ID，获取方法请参考[获取项目ID]()
    required: true
    minLength: 1
    maxLength: 64
  fleetId:
    name: fleet_id
    in: path
    description: 应用进程队列的id，由创建应用进程队列接口返回，格式为uuid，例如：77317ac6-acd8-11ec-a7e0-6805cab276a1
    required: true
    type: string
    minLength: 1
    maxLength: 64
  offset:
    name: offset
    in: query
    required: false
    type: integer
    format: int32
    minimum: 0
    maximum: 10
    default: 0
    description: 分页偏移量，为0表示第一页，为1表示从第二页开始显示
  limit:
    name: limit
    in: query
    required: false
    type: integer
    format: int32
    minimum: 1
    maximum: 100
    default: 100
    description: 单页显示的数据条数
  serverSessionId:
    name: server_session_id
    in: path
    required: true
    type: string
    description: 服务器会话id，通过创建服务器会话接口返回，全局唯一，uuid格式，例如：77317ac6-acd8-11ec-a7e0-6805cab276a1
    minLength: 1
    maxLength: 64
  clientSessionId:
    name: client_session_id
    in: path
    required: true
    type: string
    description: 客户端会话id，通过创建客户端会话接口返回，全局唯一，uuid格式，例如：77317ac6-acd8-11ec-a7e0-6805cab276a1
    minLength: 1
    maxLength: 64
