            $ref: '#/definitions/QureyTransferInfo'
        '400':
          description: 参数错误
          schema:
            $ref: '#/definitions/ErrorRsp'
        '500':
          description: 内部错误
          schema:
            $ref: '#/definitions/ErrorRsp'
  /{project_id}/lts-access-config:
