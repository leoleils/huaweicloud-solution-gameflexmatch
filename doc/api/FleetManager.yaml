swagger: '2.0'
info:
  version: v1
  title: Fleet Manager
  description: 应用进程队列管理
host: scase.myhuaweicloud.com
schemes:
  - https
basePath: /v1
produces:
  - application/json
consumes:
  - application/json; charset=UTF-8
tags:
  - name: 应用进程队列管理
  - name: 应用进程队列运行状态查询
  - name: 伸缩策略管理
  - name: 服务器会话管理
  - name: 客户端会话管理
  - name: 应用进程管理
  - name: 别名管理
  - name: 应用包管理
  - name: 用户管理
  - name: 日志管理
  - name: 其他资源管理
  - name: 首页
  - name: 实例规格管理
  - name: 事件审计
  - name: 资源监控
parameters:
  Auth-token:
    name: Auth-token
    in: header
    type: string
    description: |
      用户Token。

      通过用户登录后的请求体中获取，请求API需要在请求头中带此参数
    required: true
    minLength: 1
    maxLength: 16384
  contentType:
    name: Content-Type
    in: header
    required: true
    type: string
    minLength: 1
    maxLength: 64
    description: |
      MIME类型；带请求体的请求该字段需为 application/json;charset=utf-8
  projectId:
    name: project_id
    in: path
    type: string
    description: |
      项目ID，获取方法请参考[获取项目ID]()
    required: true
    minLength: 1
    maxLength: 64
  fleetId:
    name: fleet_id
    in: path
    description: 应用进程队列的id，由创建应用进程队列接口返回，格式为uuid，例如：77317ac6-acd8-11ec-a7e0-6805cab276a1
    required: true
    type: string
    minLength: 1
    maxLength: 64
  aliasId:
    name: alias_id
    in: path
    description: 应用进程队列别名的id，由创建应用进程队列接口返回，格式为uuid，例如：77317ac6-acd8-11ec-a7e0-6805cab276a1
    required: true
    type: string
    minLength: 1
    maxLength: 64
  offset:
    name: offset
    in: query
    required: false
    type: integer
    format: int32
    minimum: 0
    maximum: 10
    default: 0
    description: 分页偏移量，为0表示第一页，为1表示从第二页开始显示
  limit:
    name: limit
    in: query
    required: false
    type: integer
    format: int32
    minimum: 1
    maximum: 100
    default: 100
    description: 单页显示的数据条数
  serverSessionId:
    name: server_session_id
    in: path
    required: true
    type: string
    description: 服务器会话id，通过创建服务器会话接口返回，全局唯一，uuid格式，例如：77317ac6-acd8-11ec-a7e0-6805cab276a1
    minLength: 1
    maxLength: 64
  clientSessionId:
    name: client_session_id
    in: path
    required: true
    type: string
    description: 客户端会话id，通过创建客户端会话接口返回，全局唯一，uuid格式，例如：77317ac6-acd8-11ec-a7e0-6805cab276a1
    minLength: 1
    maxLength: 64
  instanceId:
    name: instance_id
    in: query
    description: 每一个实例id，由ECS服务自动生成，全局唯一，uuid格式，例如：77317ac6-acd8-11ec-a7e0-6805cab276a1
    required: false
    type: string
    minLength: 1
    maxLength: 64
  durationStart:
    name: duration_start
    in: query
    required: false
    type: integer
    format: int32
    description: 筛选当前在应用进程队列/实例/进程上的会话最小数量，默认不设置
  durationEnd:
    name: duration_end
    in: query
    required: false
    type: integer
    format: int32
    description: 筛选当前在应用进程队列/实例/进程上的会话最大数量，默认不设置
  ipAddress:
    name: ip_address
    in: query
    required: false
    type: string
    description: 筛选的ip地址，如100.20.13.25
  processId:
    name: process_id
    in: query
    required: false
    type: string
    description: 进程id，全局唯一，uuid格式，例如：77317ac6-acd8-11ec-a7e0-6805cab276a1
    minLength: 1
    maxLength: 64
  startTime:
    name: start_time
    in: query
    required: false
    type: string
    description: 筛选的数据的开始时间，例如：2022-12-01T20:37:39
    minLength: 1
    maxLength: 64
  endTime:
    name: end_time
    in: query
    required: false
    type: string
    description: 筛选的数据的结束时间，例如：2022-12-01T20:37:39
    minLength: 1
    maxLength: 64
  Userid:
    name: id
    in: query
    required: false
    description: 用户id
    type: string
  ResouarceId:
    name: id
    in: query
    required: false
    description: 资源配置id，全局唯一，uuid格式，例如c0544f73-bce0-11ed-991f-fa163ecd2502
    type: string
  eventId:
    name: event_id
    in: path
    required: true
    description: 事件id，全局唯一，uuid格式，例如c0544f73-bce0-11ed-991f-fa163ecd2502
    type: string
