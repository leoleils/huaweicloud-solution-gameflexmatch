definitions:
  CreateFleetRequestBody:
    description: 创建应用进程队列请求体
    properties:
      instance_type:
        type: string
        description: 实例类型，只支持VM，POD，VM是ECS，POD是容器
      name:
        type: string
        description: 应用进程队列的名称. 可以不唯一.
        minLength: 1
        maxLength: 1024
        example: MyDemo
      description:
        type: string
        description: 应用进程队列描述
        minLength: 1
        maxLength: 1024
        example: this is a demo
      build_id:
        type: string
        description: 应用包id，创建后不支持修改
        example: build-52d872a5-acd3-11ec-a7e0-6805cab276a1
        minLength: 1
        maxLength: 64
      region:
        type: string
        default: cn-north-4
        example: cn-north-4
        description: |-
          应用进程队列所在的region，只支持北京四region
          * cn-north-4: 北京四
        enum:
          - cn-north-4
      public_ip:
        $ref: '#/definitions/PublicIp'
        description: ECS的IP配置
      enterprise_project_id:
        type: string
        description: fleet所在的企业项目，默认为服务部署时所指定的企业项目，若服务部署时没有指定，则为默认企业项目
        default: 0
        example: 238012fd-0649-4fc8-bb89-bf6fc8b38d72
      vpc_id:
        type: string
        description: VPC id
        default: 52d872a5-acd3-11ec-a7e0-6805cab276a1
        example: 52d872a5-acd3-11ec-a7e0-6805cab276a1
      subnet_id:
        type: string
        description: 子网id
        default: 52d872a5-acd3-11ec-a7e0-6805cab276a1
        example: 52d872a5-acd3-11ec-a7e0-6805cab276a1
      server_session_protection_policy:
        type: string
        description: >-
          服务服务器会话保护策略

          * NO_PROTECTION:         不保护，缩容时如果有会话在实例上运行，直接缩容    

          * FULL_PROTECTION:       完全保护，缩容时如果有会话在实例上运行，等待会话结束再缩容

          * TIME_LIMIT_PROTECTION:
          限时保护，缩容时如果有会话在实例上运行，等待一定时间后缩容，等待时间由server_session_protection_time_limit_minutes指定
        example: NO_PROTECTION
        enum:
          - NO_PROTECTION
          - FULL_PROTECTION
          - TIME_LIMIT_PROTECTION
      server_session_protection_time_limit_minutes:
        type: integer
        format: int32
        description: server_session_protection_policy字段为TimeLimitProtection时有效，单位分钟，最大值不超过一天
        minimum: 5
        maximum: 1440
        default: 5
        example: 5
      resource_creation_limit_policy:
        $ref: '#/definitions/ResourceCreationLimitPolicy'
        description: 对客户端在指定时间内可以创建的服务器会话数量进行限制的策略。通过这个策略，你可以控制客户端消耗可用资源的能力。
      runtime_configuration:
        $ref: '#/definitions/RuntimeConfiguration'
        description: 应用进程队列的运行时配置信息
      inbound_permissions:
        type: array
        minItems: 1
        maxItems: 50
        description: 访问配置，即允许外部访问应用进程的IP地址和端口描述
        items:
          $ref: '#/definitions/IpPermission'
      instance_tags:
        type: array
        description: 实例标签数组，仅instance_type为VM时生效
        minItems: 0
        maxItems: 10
        items:
          $ref: '#/definitions/InstanceTag'
      scaling_group_capacity:
        description: 伸缩组实例初始容量参数
        $ref: '#/definitions/ScalingGroupCapacity'
      resource_specification_id:
        type: string
        description: 实例规格id
      security_group_ids:
        type: array
        items:
          type: string
        description: 安全组id
      available_zones:
        type: array
        description: 创建实例资源的可用区，可通过接口获取，为空时随机选择可用区（推荐），不为空则按照可用区优先顺序创建，仅instance_type为VM时生效
        example:
          - cn-north-4a
        items:
          type: string
        minItems: 0
        maxItems: 10
    required:
      - instance_type
      - name
      - build_id
      - vpc_id
      - runtime_configuration
      - inbound_permissions
      - resource_specification_id
    type: object
  CreateFleetResponseBody:
    required:
      - fleet
    properties:
      fleet:
        $ref: '#/definitions/Fleet'
  ShowFleetResponseBody:
    required:
      - fleet
    properties:
      fleet:
        $ref: '#/definitions/Fleet'
    type: object
  ProcessConfiguration:
    description: 应用进程描述
    properties:
      launch_path:
        type: string
        description: 应用进程启动程序路径，linux风格文件路径
        example: /home/scase/start_up.sh
        minLength: 0
        maxLength: 1024
      parameters:
        type: string
        description: 应用进程启动入参
        example: '--port=1234'
        minLength: 0
        maxLength: 1024
      concurrent_executions:
        type: integer
        description: 并发应用进程数
        example: 1
        minimum: 1
        maximum: 50
    required:
      - launch_path
      - parameters
      - concurrent_executions
  PublicIp:
    description: ECS的ip配置
    properties:
      ip_type:
        type: string
        description: 公共ip池的类型，目前只支持5_bgp与5_sbgp
        minLength: 1
        maxLength: 64
        example: 5_bgp
        default: 5_bgp
      bandwidth:
        $ref: '#/definitions/Bandwidth'
  Bandwidth:
    description: 带宽配置
    properties:
      share_type:
        type: string
        description: |-
          带宽的类型: 
          PER: 独享带宽
          WHOLE: 共享带宽
        minLength: 1
        maxLength: 64
        example: PER
        default: PER
        enum:
          - PER
          - WHOLE
      size:
        type: integer
        format: int32
        minimum: 1
        maximum: 2000
        default: 1
        example: 1
        description: 应用队列单实例公网出带宽最大值，默认1Mbps，范围1-200Mbps，可提单提高配额
      charging_mode:
        type: string
        description: |-
          带宽的计费方式: 
          traffic：按流量计费
          bandwidth: 按带宽计费
        minLength: 1
        maxLength: 64
        example: traffic
        default: traffic
        enum:
          - bandwidth
          - traffic
      id:
        type: string
        description: 共享带宽的id，当带宽类型为共享带宽时，该项必选
        minLength: 1
        maxLength: 64
        example: ''
        default: ''
  Fleet:
    description: 应用进程队列
    properties:
      instance_type:
        type: string
        description: 实例类型，只支持VM，POD
      fleet_id:
        type: string
        description: 应用进程队列的id
        minLength: 1
        maxLength: 64
        example: fleet-77317ac6-acd8-11ec-a7e0-6805cab276a1
      name:
        type: string
        description: 应用进程队列的名称. 可以不唯一.
        minLength: 1
        maxLength: 1024
        example: MyDemo
      description:
        type: string
        description: 应用队列描述
        minLength: 1
        maxLength: 1024
        example: this is a demo
      region:
